dependencies {

    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok

    // Jakarta Mail and Jakarta Activation are part of this library's public API: EmailMessage
    // extends jakarta.mail.internet.MimeMessage, ByteArrayDataSource implements
    // jakarta.activation.DataSource, and the send methods declare MessagingException. A consumer
    // therefore compiles against them too, so they are api, not implementation.
    api libs.jakarta.mail.api
    api libs.jakarta.activation.api
    // the Eclipse Angus implementations of both APIs, found at runtime through the service loader
    runtimeOnly libs.angus.mail
    runtimeOnly libs.angus.activation

    implementation libs.file.worker
    // mime-util 2.1.3 (2010) declares the slf4j-log4j12 binding and log4j 1.2.14 as compile
    // dependencies. A library must not choose its consumer's logging binding, and log4j 1.x
    // has open CVEs, so both stay out; mime-util logs through slf4j-api, which is enough
    implementation(libs.mime.util) {
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'log4j', module: 'log4j'
    }
    implementation libs.resourcebundle.core
    implementation libs.silly.strings

    testImplementation libs.bundles.unit.testing
    testRuntimeOnly libs.junit.platform.launcher
}
