[versions]
angus-activation-version = "2.0.3"
angus-mail-version = "2.0.5"
file-worker-version = "19.1"
gradle-plugin-lombok-version = "9.8.2"
gradle-plugin-nmcp-version = "1.6.2"
gradle-plugin-pitest-version = "1.19.0"
gradle-plugin-spotless-version = "8.10.4"
gradle-plugin-version-catalog-update-version = "1.1.2"
gradle-plugin-versions-version = "0.66.0"
jakarta-activation-api-version = "2.1.4"
jakarta-mail-api-version = "2.1.5"
japicmp-version = "0.26.5"
jobj-core-version = "9.1"
junit-jupiter-version = "6.1.3"
junit-platform-launcher-version = "6.1.3"
lombok-version = "1.18.48"
mime-util-version = "2.1.3"
pitest-junit5-plugin-version = "1.2.3"
pitest-version = "1.30.1"
resourcebundle-core-version = "6.1"
silly-strings-version = "9.2"
test-object-version = "9.1"

[libraries]
angus-activation = { module = "org.eclipse.angus:angus-activation", version.ref = "angus-activation-version" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "angus-mail-version" }
file-worker = { module = "io.github.astrapi69:file-worker", version.ref = "file-worker-version" }
jakarta-activation-api = { module = "jakarta.activation:jakarta.activation-api", version.ref = "jakarta-activation-api-version" }
jakarta-mail-api = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakarta-mail-api-version" }
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp-version" }
jobj-core = { module = "io.github.astrapi69:jobj-core", version.ref = "jobj-core-version" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter-version" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher-version" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok-version" }
mime-util = { module = "eu.medsea.mimeutil:mime-util", version.ref = "mime-util-version" }
resourcebundle-core = { module = "io.github.astrapi69:resourcebundle-core", version.ref = "resourcebundle-core-version" }
silly-strings = { module = "io.github.astrapi69:silly-strings", version.ref = "silly-strings-version" }
test-object = { module = "io.github.astrapi69:test-object", version.ref = "test-object-version" }

[bundles]
unit-testing = [
    "jobj-core",
    "junit-jupiter",
    "test-object",
]

[plugins]
gradle-versions-plugin = { id = "io.github.ben-manes.versions", version.ref = "gradle-plugin-versions-version" }
lombok-plugin = { id = "io.freefair.lombok", version.ref = "gradle-plugin-lombok-version" }
nmcp-gradle-plugin = { id = "com.gradleup.nmcp", version.ref = "gradle-plugin-nmcp-version" }
pitest-gradle-plugin = { id = "info.solidsoft.pitest", version.ref = "gradle-plugin-pitest-version" }
spotless-plugin-gradle = { id = "com.diffplug.spotless", version.ref = "gradle-plugin-spotless-version" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "gradle-plugin-version-catalog-update-version" }
